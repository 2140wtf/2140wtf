      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>
    <radialGradient id="liquidblobCore" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#22d3ee"/>
