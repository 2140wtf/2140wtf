<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <title>2140 — Bitcoin Culture Collective</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="2140 — Bitcoin, art, and Nostr culture." />

    <!-- Open Graph -->
    <meta property="og:title" content="2140" />
    <meta property="og:description" content="Bitcoin culture collective built on Nostr." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://2140.wtf" />
    <meta property="og:site_name" content="2140" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2140" />
    <meta name="twitter:description" content="Bitcoin culture collective built on Nostr." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- CSP: frame-src is kept as https: because 2140.wtf embeds arbitrary
         HTTPS content (e.g. external media, nsite iframes). A build-time
         allowlist could tighten this for deployments that do not need
         arbitrary embedding. See docs/project-history/security/.security-audit-final-report.md risk #4.
         Changing this to a specific allowlist requires verifying every
         embeddable origin used by the app. -->
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; font-src 'self' https:; base-uri 'self'; manifest-src 'self'; form-action 'none'; upgrade-insecure-requests; connect-src 'self' blob: https: wss: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; media-src 'self' blob: https:">
    <link rel="icon" type="image/jpeg" href="/logo.jpg">
    <link rel="apple-touch-icon" href="/logo.jpg">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/tokens-2140.css">
    <style>@keyframes app-spin{to{transform:rotate(360deg)}}</style>
  </head>
  <body style="margin:0;background:#0a0a0a">
    <!-- Pre-React loading screen. Lives OUTSIDE #root so React doesn't
         touch it. Removed by main.tsx once the app has mounted. -->
    <div id="preloader" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0a0a0a">
      <div style="display:flex;flex-direction:column;align-items:center;gap:24px">
        <img src="/logo.jpg" alt="" width="48" height="48" style="display:block;width:48px;height:48px" />
        <div data-spinner style="width:24px;height:24px;border:2.5px solid #f7931a40;border-top-color:#f7931a;border-radius:50%;animation:app-spin .7s linear infinite"></div>
      </div>
    </div>
    <!-- Blocking script: reads theme from localStorage and applies it
         before first paint so the preloader matches the user's theme. -->
    <script src="/theme.js"></script>
    <div id="root"></div>
    <script src="/process-shim.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
