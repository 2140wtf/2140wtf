name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The lockfile pins a private git dependency (@bao/court) that runners
      # can only satisfy from the warm npm cache; when npm chooses to
      # re-resolve it over the network the install fails (observed on
      # fork-PR runs). --offline forces the cache path, with an online
      # fallback for genuine cache misses.
      - name: Clean install dependencies
        run: npm ci --offline || npm ci
          
      - name: Run tests
        run: npm run test
