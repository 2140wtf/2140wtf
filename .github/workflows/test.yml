name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
        
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # @bao/court (public github:baocommunity/bao-court, pinned to the
      # v0.2.0 tag) is fetched by npm as an anonymous HTTPS tarball from
      # codeload.github.com, so cold-cache installs work on runners. The
      # offline-first pattern below is retained defensively against network
      # flakiness; the fallback covers genuine cache misses. (Older fork-PR
      # install failures predate the dependency going public.)
      - name: Clean install dependencies
        run: npm ci --offline || npm ci
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: git+ssh://git@github.com/
          
      - name: Run tests
        run: npm run test
