name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: BAO Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Scan source for leaked secrets and dangerous code
        run: node scripts/security-scan.mjs

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-scan-report
          path: security-scan-report.json
          if-no-files-found: error
          retention-days: 90

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # Offline-first: @bao/court (public, pinned to v0.2.0; installs from
      # warm cache or anonymous HTTPS tarball) — see test.yml.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --offline || npm ci --no-audit --no-fund
        env:
          # GitHub git deps serialize as ssh:// in package-lock.json; rewrite
          # to anonymous HTTPS so keyless CI can clone them.
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: git+ssh://git@github.com/

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit-results.json
          STATUS=$?
          set -e
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('audit-results.json','utf8')); const v=data.metadata?.vulnerabilities ?? {}; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Dependency Audit\\n\\n- Critical: '+(v.critical ?? 0)+'\\n- High: '+(v.high ?? 0)+'\\n- Moderate: '+(v.moderate ?? 0)+'\\n');"
          exit "$STATUS"

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: audit-results.json
          if-no-files-found: error
          retention-days: 90
