name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build
        env:
          # Pets battle escrow operator pubkey + release URL (public values —
          # repo Settings → Secrets and variables → Actions → Variables). The
          # URL must be HTTPS: Pages serves the app over HTTPS and browsers
          # block http:// API calls as mixed content.
          VITE_PETS_BATTLE_ESCROW_PUBKEY: ${{ vars.VITE_PETS_BATTLE_ESCROW_PUBKEY }}
          VITE_PETS_BATTLE_ESCROW_URL: ${{ vars.VITE_PETS_BATTLE_ESCROW_URL }}
        run: |
          npm install
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
