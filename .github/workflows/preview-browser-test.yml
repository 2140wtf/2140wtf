name: Preview Browser Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Offline-first: @bao/court (public, pinned to v0.2.0; installs from
      # warm cache or anonymous HTTPS tarball) — see test.yml.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --offline || npm ci --no-audit --no-fund
        env:
          # GitHub git deps serialize as ssh:// in package-lock.json; rewrite
          # to anonymous HTTPS so keyless CI can clone them.
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: git+ssh://git@github.com/

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build preview
        run: npm run build

      - name: Run browser smoke tests
        env:
          CI: true
          PLAYWRIGHT_START_SERVER: '1'
          PLAYWRIGHT_PORT: '3510'
        run: npx playwright test -c e2e/playwright.config.ts specs/smoke.spec.ts

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-browser-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
